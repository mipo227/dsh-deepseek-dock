<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
<title>DSH DeepSeek Dock</title>
<style>
__CSS__

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}

body { -webkit-app-region: no-drag; }

.dsd-root {
  right: 12px;
  bottom: 12px;
  --dsd-tint: rgba(10, 10, 12, 0.58);
}

.dsd-card {
  max-height: none;
}

.dsd-caption {
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
</style>
</head>
<body>
  <div class="dsd-root" id="dock" data-open="false" data-progress="none" data-low="false">
    <div class="dsd-card" id="card" role="dialog" aria-label="DeepSeek status" aria-hidden="true">
      <div class="dsd-head">
        <div class="dsd-brand">
          <svg viewBox="0 0 50 50" aria-hidden="true">__WHALE__</svg>
          <span>DeepSeek</span>
        </div>
        <button class="dsd-refresh" id="refresh" type="button" title="刷新" aria-label="刷新">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"></path><path d="M20.5 3.5V9H15"></path>
          </svg>
        </button>
      </div>
      <div class="dsd-label">账户余额</div>
      <div class="dsd-amount" id="amount" data-level="none"><span class="dsd-cny" id="currency">¥</span><span id="balance">—</span></div>
      <div class="dsd-meta">
        <span class="dsd-tag" id="peaktag" data-peak="false"><i aria-hidden="true"></i><span id="peaklabel">谷时</span></span>
        <span id="source">等待 DSH 同步</span>
      </div>
      <div class="dsd-rule"></div>
      <div class="dsd-usage-grid">
        <div class="dsd-stat"><b id="tok-in">—</b><span>输入</span></div>
        <div class="dsd-stat"><b id="tok-out">—</b><span>输出</span></div>
        <div class="dsd-stat"><b id="tok-cache">—</b><span>缓存命中</span></div>
      </div>
      <div class="dsd-costline"><span id="sessionline">最近会话 · —</span><b id="cost">≈ —</b></div>
      <div class="dsd-rule"></div>
      <div class="dsd-section-head"><span>任务</span><b id="taskcount">—</b></div>
      <div class="dsd-progress" id="progress-wrap"><i id="bar" style="width:0%"></i></div>
      <ul class="dsd-todos" id="todos"></ul>
      <div class="dsd-empty" id="empty"><b>暂无任务清单</b><span>智能体开始多步任务时，会在这里显示完成进度</span></div>
      <div class="dsd-foot"><span id="footnote">等待 DSH 同步</span><span id="updated"></span></div>
    </div>
    <div class="dsd-tile-wrap">
      <button class="dsd-tile" id="tile" type="button" aria-expanded="false" aria-label="打开 DeepSeek 状态">
        <svg class="dsd-logo" viewBox="0 0 50 50" aria-hidden="true">__WHALE__</svg>
        <span class="dsd-tile-bar" aria-hidden="true"><i id="tile-bar-fill" style="width:0%"></i></span>
      </button>
      <button class="dsd-caption" id="caption" type="button" data-low="false" aria-label="打开 DeepSeek 状态">
        <span class="dsd-caption-money" id="caption-money">¥—</span>
        <span class="dsd-caption-sep" aria-hidden="true">·</span>
        <span class="dsd-caption-task" id="caption-task"></span>
      </button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
